<!DOCTYPE html>
<html>
    <head>
        <title>SimpleWall</title>
        <link rel="icon" href="images/favicon.png" type="image/png">
        <link rel="stylesheet" href="index.css">
        <script src="functionality.js" defer></script>
    </head>
    <body style="background-color:#000022;">
        <div class="inputBox">
                <input type="text" class="postInput" name="postBox" placeholder="Enter your post here...">
                <button type="submit" class="submitButton">Post</button>
        </div>
        <div class="posts">
                <div class="post">
                        <h1 class="postTitle">This is a title <!--- Top line that fits the report button and post title --->
                            <button class="reportButton">Report</button>
                        </h1>
                        <p class="postContent">This is a sample post.</p>
                        <span class="postTime">Just now</span>
                        <span class="likes">1 like</span>
                        <button class="likeButton">Like</button>
                        <button class="dislikeButton">Dislike</button>
                        
                </div>
        </div>
    </body>
</html>
